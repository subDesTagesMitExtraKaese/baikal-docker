# Required repository secrets:
#   REGISTRY_USERNAME - Forgejo username for the container registry
#   REGISTRY_PASSWORD - Forgejo access token with package write permission
name: docker build

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: git.justprojects.de

jobs:
  build:
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: apache.dockerfile
            tags: latest,apache,VERSION,VERSION-apache
          - dockerfile: apache-php8.2.dockerfile
            tags: apache-php8.2,php8.2,VERSION-apache-php8.2,VERSION-php8.2
          - dockerfile: nginx.dockerfile
            tags: nginx,VERSION-nginx
          - dockerfile: nginx-php8.2.dockerfile
            tags: nginx-php8.2,VERSION-nginx-php8.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${REGISTRY}/${repository}" >> "${GITHUB_ENV}"

      - name: Set Baikal version and image tags
        run: |
          version="$(sed -n 's/^ENV VERSION //p' ${{ matrix.dockerfile }})"
          echo "BAIKAL_VERSION=${version}" >> "${GITHUB_ENV}"

          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          tags="$(printf '%s' '${{ matrix.tags }}' \
            | tr ',' '\n' \
            | sed "s/VERSION/${version}/g; s|^|${REGISTRY}/${repository}:|")"

          {
            echo "IMAGE_TAGS<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      # See https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # See https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # See https://github.com/docker/login-action
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8,linux/386
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          labels: |
            org.opencontainers.image.url=https://${{ env.REGISTRY }}/${{ github.repository }}
            org.opencontainers.image.source=https://${{ env.REGISTRY }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.BAIKAL_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=Baikal
            org.opencontainers.image.description=Ready-to-go Baikal server
