# Docker Compose file for a Baikal server with MariaDB
# Based on issue https://github.com/ckulka/baikal-docker/issues/10

services:
  baikal:
    image: ckulka/baikal:nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - config:/var/www/baikal/config
      - data:/var/www/baikal/Specific

  db:
    image: mariadb:12.3
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: adalovelace
      MARIADB_DATABASE: baikal
      MARIADB_USER: baikal
      MARIADB_PASSWORD: ilovecookies
    volumes:
      - db:/var/lib/mysql

volumes:
  config:
  data:
  db:
